name: build

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  linux-and-windows:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Build jc-dev image
        run: docker build -t jc-dev docker
      - name: Linux build
        run: docker run --rm -v "$PWD:/work" -u "$(id -u)" jc-dev bash -c "cmake -S . -B build-linux -G Ninja -DCMAKE_BUILD_TYPE=Release && cmake --build build-linux"
      - name: Windows build (.scr)
        run: docker run --rm -v "$PWD:/work" -u "$(id -u)" jc-dev bash -c "cmake -S . -B build-win64 -G Ninja -DCMAKE_BUILD_TYPE=Release -DCMAKE_TOOLCHAIN_FILE=cmake/mingw-w64-x86_64.cmake && cmake --build build-win64"
      - uses: actions/upload-artifact@v4
        with:
          name: johnny-linux-windows
          path: |
            build-linux/johnny
            build-win64/JohnnyCastaway.scr

  macos-arm64:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - run: brew install sdl2 ninja
      - name: macOS build
        run: cmake -S . -B build-mac -G Ninja -DCMAKE_BUILD_TYPE=Release -DCMAKE_OSX_ARCHITECTURES=arm64 && cmake --build build-mac
      - uses: actions/upload-artifact@v4
        with:
          name: johnny-macos-arm64
          path: build-mac/johnny
