services:
  jc-dev:
    build:
      context: ./docker
      dockerfile: Dockerfile
      platforms: [linux/amd64]
    image: jc-dev:latest
    container_name: jc-dev
    platform: linux/amd64
    working_dir: /work
    volumes:
      - ./:/work
      - ./original:/assets:ro
      - jc-ghidra-projects:/home/dev/.ghidra
      - jc-rea-state:/home/dev/.rea
    environment:
      JC_ASSETS_DIR: /assets
    stdin_open: true
    tty: true
    command: ["sleep", "infinity"]

volumes:
  jc-ghidra-projects:
  jc-rea-state:
